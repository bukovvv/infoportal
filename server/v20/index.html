<title>zanimwyjdziesz 2.0 Tarcza</title>
<style>
/* Układ: koło = przycisk i stacja, płyta = treść. Bez obrysów i cieni; jedna ciemna płyta na ekran (najbliższy wyjazd), jedna czerwień (główny przycisk). */
:root{
  --papier:#FBFBFC; --plyta:#EFF1F4; --plyta-2:#E2E6EB; --kreska:#D5DAE1;
  --tusz:#14171C; --tusz-2:#5A626E;
  --akcja:#D2232A; --na-akcji:#FFFFFF; --akcja-tekst:#B81D24;
  --ok:#0E7A55; --ok-tlo:#DDF1E8; --opoz:#9A5200; --opoz-tlo:#FBEBCF;
  --blok:#14171C; --na-bloku:#FBFBFC; --na-bloku-2:#AEB6C2; --blok-tor:#353B45;
  --r-s:10px; --r-m:16px; --r-l:28px;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --papier:#0E1013; --plyta:#181B20; --plyta-2:#252930; --kreska:#343943;

  --ok:#5FD0A0; --ok-tlo:#12352A; --opoz:#F2B95C; --opoz-tlo:#3A2A0C;
  --blok:#252930; --na-bloku:#F1F3F6; --na-bloku-2:#A3ABB7; --blok-tor:#3D434E; color-scheme:dark}}
:root[data-theme="dark"]{
  --papier:#0E1013; --plyta:#181B20; --plyta-2:#252930; --kreska:#343943;
  --tusz:#F1F3F6; --tusz-2:#A3ABB7; --akcja-tekst:#FF8084;
  --ok:#5FD0A0; --ok-tlo:#12352A; --opoz:#F2B95C; --opoz-tlo:#3A2A0C;
  --blok:#252930; --na-bloku:#F1F3F6; --na-bloku-2:#A3ABB7; --blok-tor:#3D434E; color-scheme:dark}
/* Małopolska: ten sam układ, akcja w stonowanym niebieskim, ciemna płyta granatowa */
:root[data-region="mal"]{--akcja:#2A55B0;--akcja-tekst:#2A55B0;--blok:#141C29;--blok-tor:#2B3548}

:root[data-region="mal"][data-theme="dark"]{--akcja:#B3C6F2;--na-akcji:#141C29;--akcja-tekst:#B3C6F2;--blok:#1F2736;--blok-tor:#35405A}

html,body{height:100%}
body{background:var(--papier);color:var(--tusz);font-family:var(--f);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}

/* szkielet */

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:25;background:var(--papier)}
.gora-in{max-width:1120px;margin:0 auto;height:64px;display:flex;align-items:center;gap:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.logo svg{flex:none}
.logo b{font-weight:700;font-size:15px;line-height:1.05;letter-spacing:-.01em}
.logo b span{display:block}
.menu{display:none;gap:4px}
.menu a{height:40px;padding:0 16px;border-radius:var(--r-m);display:flex;align-items:center;text-decoration:none;font-weight:600;color:var(--tusz-2)}

.kolo:hover{background:var(--plyta-2)}
main{max-width:1120px;margin:0 auto;padding-block:8px 112px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dol{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--papier);border-top:1px solid var(--kreska);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:8px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.dol a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;font-size:11px;font-weight:600;color:var(--tusz-2)}

.kol{display:flex;flex-direction:column;gap:16px;min-width:0}

.dr{color:var(--tusz-2)}
.maly{font-size:13px}
.wiersz{display:flex;align-items:center;gap:12px;min-width:0}

/* płyta */
.plyta{background:var(--plyta);border-radius:var(--r-l);padding:16px}

/* tarcza: liczba minut w kole; zdanie obok podaje godzinę i minut nie powtarza */
.tarcza{position:relative;flex:none;display:grid;place-items:center;width:76px;height:76px}

.tarcza span{position:relative;font-weight:700;font-size:26px;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.tarcza small{display:block;font-size:11px;font-weight:600;margin-top:2px;opacity:.75}

/* formularz */
.pole{display:flex;flex-direction:column;justify-content:center;background:var(--papier);border-radius:var(--r-m);height:60px;padding:0 16px;min-width:0}

.skad-dokad{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;position:relative}
.skad-dokad .pole{padding-right:64px}
.zamien{position:absolute;right:12px;top:50%;margin-top:-22px;background:var(--plyta);border:4px solid var(--plyta)}
.zamien:hover{background:var(--plyta-2)}
.chip{height:44px;padding:0 14px;border-radius:var(--r-m);background:var(--papier);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tusz);color:var(--papier)}
.na-papierze .chip{background:var(--plyta)}
.na-papierze .chip[aria-pressed="true"]{background:var(--tusz)}
.glowny{height:56px;border-radius:var(--r-m);background:var(--akcja);color:var(--na-akcji);font-weight:700;font-size:17px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.glowny:hover{filter:brightness(.94)}
.drugi{height:48px;padding:0 16px;border-radius:var(--r-m);background:var(--plyta);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.plyta .drugi{background:var(--plyta-2)} /* przycisk na płycie odróżnia się od niej */
.drugi:hover{background:var(--plyta-2)}
.drugi:disabled{opacity:.4;cursor:default}
.blok .drugi{background:var(--blok-tor);color:var(--na-bloku)}
.tekstowy{font-weight:700;font-size:14px;color:var(--akcja-tekst);height:44px;padding:0 6px;display:inline-flex;align-items:center;gap:6px}
.reg{background:var(--plyta);height:40px;font-size:13px;padding:0 12px;gap:4px}
.reg:hover{background:var(--plyta-2)}

/* linia, znaczniki */
.lin{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;white-space:nowrap}
.lin::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.znak{display:inline-flex;align-items:center;font-weight:700;font-size:13px;padding:4px 9px;border-radius:var(--r-s);white-space:nowrap}
.znak.ok{background:var(--ok-tlo);color:var(--ok)}
.znak.op{background:var(--opoz-tlo);color:var(--opoz)}
.znak.neutr{background:var(--plyta-2);color:var(--tusz)}
.plyta .znak.neutr,.pol .znak.neutr{background:var(--papier)}

/* połączenie na liście */
.pol{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;padding:14px 16px;border-radius:var(--r-l);background:var(--plyta)}
.pol:hover{background:var(--plyta-2)}
.pol .g{display:flex;justify-content:space-between;align-items:center;gap:6px 10px;flex-wrap:wrap}
.godz{font-weight:700;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}

.pol .meta .lin{color:var(--tusz)}
.strony{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* szczegóły */
.detal{display:none}
.detal.otwarty{display:block;position:fixed;inset:0;z-index:30;background:var(--papier);overflow:auto;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.detal-gl{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;height:56px}

.kafle{display:flex;gap:8px;flex-wrap:wrap}
.kafel{min-width:64px;padding:8px 12px;border-radius:var(--r-m);background:var(--blok-tor);display:flex;flex-direction:column}
.kafel span{font-size:11px;font-weight:600;color:var(--na-bloku-2)}
.kafel b{font-weight:700;font-size:20px;line-height:1.15;font-variant-numeric:tabular-nums}

/* oś kursu */
.os{display:grid;grid-template-columns:48px 24px minmax(0,1fr);align-items:center;min-height:36px;column-gap:6px}
.os time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--tusz-2)}
.os .sz{position:relative;align-self:stretch}

.os.byl time,.os.byl .n{opacity:.5}

/* tablica */
.rzad{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 8px;border-radius:var(--r-m)}

.rzad+.rzad{box-shadow:0 -1px 0 var(--kreska)}
.rzad .g{font-weight:700;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.1}
.rzad .g s{display:block;font-size:12px;color:var(--tusz-2);font-weight:500}

/* mapa */
.mapa-okno{overflow:auto;border-radius:var(--r-l);background:var(--plyta)}
.mapa-okno svg{display:block;width:100%;min-width:700px;height:auto}

.mapa-okno text.wazna{font-size:13px;font-weight:700;fill:var(--tusz)}

.mapa-okno .kmap.utr text{fill:var(--opoz)}
.mapa-okno .kmap.pow text{fill:var(--papier)}
.poc{cursor:pointer}
.poc text{font-size:11px;font-weight:700;fill:var(--papier)}

.ark{background:var(--papier);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}

.zegar .slup span{font-size:12px;font-weight:600;color:var(--tusz-2)}
.zegar .kolo{background:var(--papier)}

.zegar .dw{font-weight:700;font-size:40px;line-height:1;padding-bottom:20px}

/* opcje wyszukiwania */
.wybor{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wybor button{text-align:left;padding:14px;border-radius:var(--r-m);background:var(--plyta);display:flex;flex-direction:column;gap:2px}
.wybor button span{font-size:13px;color:var(--tusz-2)}
.wybor button[aria-pressed="true"]{background:var(--tusz);color:var(--papier)}

.przel-rz+.przel-rz{box-shadow:0 -1px 0 var(--kreska)}

.przel i{position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--papier)}

.bieg{position:relative;height:8px;border-radius:4px;background:var(--blok-tor);margin:6px 9px}

    .ulgi-lista::-webkit-scrollbar{width:10px}
  }
  @supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}}
}
/* ---------- telefon ---------- */
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))} /* nagłówki nie chowają się pod górnym paskiem */
.wyj{cursor:pointer}
.wyj-strz{display:inline-flex;opacity:.7}
.kafle{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.fakty{grid-template-columns:repeat(auto-fit,minmax(72px,1fr))}
.dni{display:flex;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.dni::-webkit-scrollbar{display:none}
.dni .chip{flex:none}
@media (max-width:919px){
  .wyj-akcje{display:none}
  .wyj .wielkie{font-size:25px}
  .wyj .tarcza{width:62px;height:62px}
  .wyj .tarcza span{font-size:21px}
  .fakty{grid-template-columns:1fr 1fr} /* 4 fakty karty pociągu: 2 × 2 zamiast 3 + 1 */
  .kafel{padding:8px;min-width:0}
  .kafel b{font-size:16px;white-space:nowrap}
  .kafel span{white-space:nowrap}
  .rzad{padding:8px 6px;grid-template-columns:54px minmax(0,1fr) auto}
  .rzad .g{font-size:17px}
  .rzad .pe b{font-size:16px}
  /* mapa: cały ekran między paskami, licznik i przyciski na karcie nad mapą */
  #v-mapa{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 calc(74px + env(safe-area-inset-bottom,0px)) 0;z-index:5;gap:0}
  #v-mapa>.wiersz{position:absolute;z-index:2;top:10px;left:10px;right:10px;gap:6px 10px;padding:8px 8px 8px 14px;background:var(--papier);border-radius:var(--r-l);box-shadow:0 8px 24px rgba(0,0,0,.16)}
  #v-mapa h1{display:none}
  #v-mapa #mapa-opis{font-size:13px}
  #v-mapa>.wiersz .drugi{height:40px;padding:0 12px}
  #v-mapa>p{display:none}
  #mapa-okno{height:100%;min-height:0;border-radius:0}
}
.nazwa-p{font-size:16px;font-weight:600;color:var(--tusz-2)}
.blok .nazwa-p{color:var(--na-bloku-2)}
.drugi.wlaczony,.kolo.wlaczony{background:var(--tusz)!important;color:var(--papier)}
/* punktualność na karcie pociągu */
.pkt-gl{display:flex;align-items:center;gap:14px;line-height:1.3}
.pkt-gl small{font-size:12px;color:var(--tusz-2)}
.pkt-proc{font-size:42px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.pkt-proc.ok{color:var(--ok)}.pkt-proc.opoz{color:var(--opoz)}.pkt-proc.zle{color:var(--akcja-tekst)}
.pkt-slupki{display:flex;align-items:flex-end;gap:3px;height:56px;border-bottom:1px solid var(--kreska)}
.pkt-slupki i,.pkt-leg i{background:var(--ok)}
.pkt-slupki i{flex:1;max-width:14px;height:var(--h);border-radius:3px 3px 0 0}
.pkt-slupki i.pozn,.pkt-leg i.pozn{background:var(--opoz)}
.pkt-slupki i.odw,.pkt-leg i.odw{background:repeating-linear-gradient(45deg,var(--akcja-tekst) 0 3px,transparent 3px 6px)}
.pkt-leg{display:flex;gap:6px 14px;flex-wrap:wrap}
.pkt-leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.moje-gl,.kom-gl{display:flex;flex-direction:column;gap:12px}
@media (min-width:920px){
  #mapa-okno{height:calc(100dvh - 200px)}
  .tlo-ark.boczny{inset:80px 16px 16px auto;background:none;pointer-events:none;align-items:flex-start}
  .tlo-ark.boczny .ark{pointer-events:auto;width:420px;max-height:100%;box-shadow:0 16px 48px rgba(0,0,0,.28)}
  #v-stacje{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px 28px;align-items:start}
  #v-stacje>h1{grid-column:1/-1}
  #v-stacje>:not(h1):not(#tablica){grid-column:1}
  #v-stacje>#tablica{grid-column:2;grid-row:2/span 3}
  .moje-gl{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:28px;align-items:start}
  .moje-bok{position:sticky;top:88px}
  .kom-gl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
  .kom-panel{position:sticky;top:88px;max-height:calc(100dvh - 110px);overflow:auto;padding:24px}
  /* Szukaj: dwie równe kolumny; szczegóły jasne — jedna ciemna płyta na ekran (najbliższy wyjazd) */
  .dwa{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .detal,.detal.otwarty{top:88px;max-height:calc(100dvh - 104px);overflow:auto}
  .detal .blok{--blok:var(--plyta);--na-bloku:var(--tusz);--na-bloku-2:var(--tusz-2);--blok-tor:var(--plyta-2)}
  .detal .cta{background:var(--papier)}
  .btk-gl{grid-template-columns:minmax(0,1fr) 340px}
  /* mapa: cały ekran pod górnym paskiem, nagłówek jako karta na mapie */
  #v-mapa{position:fixed;inset:calc(64px + env(safe-area-inset-top,0px)) 0 0 0;z-index:5;gap:0}
  #v-mapa>.wiersz{position:absolute;z-index:2;top:16px;left:16px;right:auto;gap:12px 16px;padding:10px 12px 10px 20px;background:var(--papier);border-radius:var(--r-l);box-shadow:0 8px 28px rgba(0,0,0,.18)}
  #v-mapa h1{font-size:22px}
  #v-mapa>p{display:none}
  #mapa-okno{height:100%;border-radius:0}
}
</style>
